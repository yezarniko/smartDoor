<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">SmartDoor 12 volt solenoid hardware wiring</title>
  <desc id="desc">Exact connection diagram for the pictured 30-pin USB-C ESP32, pictured VCC IN1 GND relay module, and 12 volt solenoid lock.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .section { font: 700 25px Arial, sans-serif; fill: white; }
      .head { font: 700 23px Arial, sans-serif; fill: #111827; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; dominant-baseline: middle; }
      .body { font: 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 16px Arial, sans-serif; fill: #475569; }
      .tiny { font: 14px Arial, sans-serif; fill: #475569; }
      .white { fill: white; }
      .warn { font: 700 18px Arial, sans-serif; fill: #991b1b; }
      .wire { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">SMARTDOOR — EXACT 12 V SOLENOID WIRING</text>

  <rect x="45" y="75" width="900" height="48" rx="12" fill="#164e9a"/>
  <text x="495" y="108" text-anchor="middle" class="section">5 V RELAY LOGIC + ESP32 INDICATORS</text>
  <rect x="980" y="75" width="575" height="48" rx="12" fill="#b91c1c"/>
  <text x="1268" y="108" text-anchor="middle" class="section">SEPARATE 12 V LOCK CIRCUIT</text>
  <line x1="965" y1="72" x2="965" y2="880" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 12"/>

  <!-- Exact ESP32 connection block -->
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="365" height="570" rx="28" fill="#111827" stroke="#334155" stroke-width="4"/>
    <rect x="135" y="185" width="205" height="84" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <path d="M155 225h35v-18h35v18h35v-18h35v18h25" fill="none" stroke="#334155" stroke-width="5"/>
    <rect x="125" y="295" width="225" height="205" rx="8" fill="#ad9863" stroke="#e7d7a4" stroke-width="3"/>
    <text x="238" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="white">ESP-32</text>
    <text x="238" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">30-PIN • USB-C</text>
    <rect x="185" y="682" width="105" height="55" rx="9" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="205" y="694" width="65" height="23" rx="6" fill="#475569"/>
  </g>
  <text x="238" y="758" text-anchor="middle" class="head">ESP32 DEVKIT V1</text>

  <!-- ESP32 used terminals -->
  <g>
    <circle cx="399" cy="220" r="11" fill="#dc2626" stroke="white" stroke-width="3"/><text x="375" y="220" text-anchor="end" class="label white">VIN</text>
    <circle cx="399" cy="285" r="11" fill="#111111" stroke="white" stroke-width="3"/><text x="375" y="285" text-anchor="end" class="label white">GND</text>
    <circle cx="399" cy="350" r="11" fill="#f97316" stroke="white" stroke-width="3"/><text x="375" y="350" text-anchor="end" class="label white">D18</text>
    <circle cx="399" cy="515" r="11" fill="#2563eb" stroke="white" stroke-width="3"/><text x="375" y="515" text-anchor="end" class="label white">D19</text>
    <circle cx="399" cy="585" r="11" fill="#16a34a" stroke="white" stroke-width="3"/><text x="375" y="585" text-anchor="end" class="label white">D21</text>
    <circle cx="399" cy="655" r="11" fill="#7c3aed" stroke="white" stroke-width="3"/><text x="375" y="655" text-anchor="end" class="label white">D5</text>
  </g>

  <!-- Exact relay module layout -->
  <g filter="url(#shadow)">
    <rect x="565" y="170" width="355" height="315" rx="22" fill="#111827" stroke="#334155" stroke-width="4"/>
    <text x="742" y="203" text-anchor="middle" class="head white">1 RELAY MODULE</text>
    <rect x="685" y="225" width="170" height="150" rx="10" fill="#1667ae" stroke="#93c5fd" stroke-width="3"/>
    <text x="770" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">SRD-05VDC-SL-C</text>
    <text x="770" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">5 V RELAY COIL</text>
    <text x="770" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white">D2 COIL DIODE ON BOARD</text>

    <rect x="565" y="230" width="56" height="178" rx="8" fill="#e5e7eb" stroke="#64748b" stroke-width="3"/>
    <circle cx="593" cy="263" r="11" fill="#dc2626"/><text x="632" y="263" class="label white">VCC</text>
    <circle cx="593" cy="319" r="11" fill="#f97316"/><text x="632" y="319" class="label white">IN1</text>
    <circle cx="593" cy="375" r="11" fill="#111111" stroke="white" stroke-width="2"/><text x="632" y="375" class="label white">GND</text>

    <rect x="885" y="225" width="35" height="180" rx="5" fill="#dbeafe" stroke="#64748b" stroke-width="3"/>
    <circle cx="903" cy="263" r="11" fill="#64748b"/><text x="874" y="263" text-anchor="end" class="tiny">A</text>
    <circle cx="903" cy="319" r="11" fill="#64748b"/><text x="874" y="319" text-anchor="end" class="tiny">B</text>
    <circle cx="903" cy="375" r="11" fill="#64748b"/><text x="874" y="375" text-anchor="end" class="tiny">C</text>

    <rect x="650" y="414" width="62" height="28" rx="4" fill="#2563eb" stroke="white" stroke-width="2"/>
    <rect x="660" y="420" width="42" height="15" rx="3" fill="#fbbf24"/>
    <text x="734" y="434" class="tiny white">VCC–JD_VCC JUMPER</text>
  </g>

  <!-- Exact logic wires: no crossings or swapped endpoints -->
  <path d="M399 220 H505 V263 H593" class="wire" stroke="#dc2626"/>
  <path d="M399 350 H500 V319 H593" class="wire" stroke="#f97316"/>
  <path d="M399 285 H450 V450 H540 V375 H593" class="wire" stroke="#111111"/>
  <text x="458" y="208" class="tiny">5 V FROM USB VIN</text>
  <text x="458" y="339" class="tiny">HIGH = UNLOCK</text>

  <!-- Indicators and buzzer -->
  <path d="M399 515 H500" class="wire" stroke="#2563eb"/>
  <rect x="500" y="501" width="92" height="28" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="546" y="520" text-anchor="middle" class="tiny">220–330 Ω</text>
  <path d="M592 515 H638" class="wire" stroke="#2563eb"/>
  <circle cx="660" cy="515" r="18" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <path d="M678 515 H930" class="wire" stroke="#111111"/>
  <text x="700" y="504" class="label">RED LED — LOCKED</text>

  <path d="M399 585 H500" class="wire" stroke="#16a34a"/>
  <rect x="500" y="571" width="92" height="28" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="546" y="590" text-anchor="middle" class="tiny">220–330 Ω</text>
  <path d="M592 585 H638" class="wire" stroke="#16a34a"/>
  <circle cx="660" cy="585" r="18" fill="#16a34a" stroke="#166534" stroke-width="3"/>
  <path d="M678 585 H930" class="wire" stroke="#111111"/>
  <text x="700" y="574" class="label">GREEN LED — UNLOCKED</text>

  <path d="M399 655 H560" class="wire" stroke="#7c3aed"/>
  <circle cx="595" cy="655" r="28" fill="#334155" stroke="#0f172a" stroke-width="3"/>
  <circle cx="595" cy="651" r="8" fill="#020617"/>
  <path d="M623 655 H930" class="wire" stroke="#111111"/>
  <text x="640" y="644" class="label">PASSIVE PIEZO</text>

  <!-- Shared logic ground bus -->
  <path d="M593 375 V500 H930 V700 H905" class="wire" stroke="#111111"/>
  <circle cx="930" cy="515" r="7" fill="#111111"/>
  <circle cx="930" cy="585" r="7" fill="#111111"/>
  <circle cx="930" cy="655" r="7" fill="#111111"/>
  <line x1="912" y1="700" x2="948" y2="700" stroke="#111111" stroke-width="5"/>
  <line x1="918" y1="710" x2="942" y2="710" stroke="#111111" stroke-width="4"/>
  <line x1="924" y1="720" x2="936" y2="720" stroke="#111111" stroke-width="3"/>
  <text x="882" y="716" text-anchor="end" class="tiny">ALL LOGIC GND</text>

  <!-- Relay screw terminal identification warning -->
  <rect x="520" y="775" width="420" height="92" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="730" y="805" text-anchor="middle" class="warn">PHYSICAL SCREW TERMINALS A / B / C</text>
  <text x="730" y="832" text-anchor="middle" class="small">Identify COM, NO, and NC with a continuity meter.</text>
  <text x="730" y="855" text-anchor="middle" class="small">Do not assume their vertical order from the photo.</text>

  <!-- 12 V supply -->
  <g filter="url(#shadow)">
    <rect x="1375" y="500" width="150" height="205" rx="18" fill="#1f2937" stroke="#0f172a" stroke-width="4"/>
    <text x="1450" y="567" text-anchor="middle" class="head white">12 V DC</text>
    <text x="1450" y="600" text-anchor="middle" class="head white">SUPPLY</text>
    <circle cx="1388" cy="535" r="9" fill="#dc2626"/><text x="1410" y="538" class="label white">+</text>
    <circle cx="1388" cy="670" r="9" fill="#111111" stroke="white" stroke-width="2"/><text x="1410" y="673" class="label white">−</text>
  </g>

  <!-- Symbolic COM/NO/NC: map after meter test -->
  <rect x="1010" y="490" width="95" height="45" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1058" y="518" text-anchor="middle" class="label">COM</text>
  <rect x="1010" y="405" width="95" height="45" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="1058" y="433" text-anchor="middle" class="label">NO</text>
  <rect x="1010" y="590" width="95" height="45" rx="9" fill="#e5e7eb" stroke="#64748b" stroke-width="3"/>
  <text x="1058" y="618" text-anchor="middle" class="label">NC</text>
  <path d="M1058 490 V464 L1090 445" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M1105 428 H1140" class="wire" stroke="#dc2626"/>
  <path d="M1105 612 H1180" class="wire" stroke="#94a3b8" stroke-dasharray="10 10"/>
  <text x="1190" y="617" class="small">UNUSED</text>

  <!-- Fuse and exact positive path: supply + -> fuse -> COM -> NO -> red lock -->
  <path d="M1388 535 H1325" class="wire" stroke="#dc2626"/>
  <rect x="1250" y="518" width="75" height="34" rx="9" fill="#e5e7eb" stroke="#475569" stroke-width="3"/>
  <text x="1288" y="541" text-anchor="middle" class="tiny">FUSE</text>
  <path d="M1250 535 H1150 V512 H1105" class="wire" stroke="#dc2626"/>

  <!-- 12 V solenoid -->
  <g filter="url(#shadow)">
    <rect x="1210" y="175" width="300" height="155" rx="18" fill="#d1d5db" stroke="#64748b" stroke-width="4"/>
    <rect x="1165" y="218" width="55" height="70" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <path d="M1165 233 l-35 20 35 20" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
    <text x="1360" y="225" text-anchor="middle" class="head">12 V SOLENOID LOCK</text>
    <text x="1360" y="258" text-anchor="middle" class="body">POWER-ON-TO-UNLOCK</text>
    <text x="1360" y="290" text-anchor="middle" class="small">RED (+) • BLACK (−)</text>
  </g>
  <circle cx="1240" cy="345" r="8" fill="#dc2626"/><text x="1258" y="349" class="label">RED (+)</text>
  <circle cx="1450" cy="345" r="8" fill="#111111"/><text x="1468" y="349" class="label">BLACK (−)</text>

  <path d="M1140 428 H1185 V345 H1240" class="wire" stroke="#dc2626"/>
  <path d="M1450 345 H1540 V670 H1388" class="wire" stroke="#111111"/>

  <!-- External flyback diode directly across solenoid -->
  <path d="M1240 345 V375 H1335" class="wire" stroke="#dc2626"/>
  <path d="M1450 345 V375 H1378" class="wire" stroke="#111111"/>
  <line x1="1335" y1="354" x2="1335" y2="396" stroke="#111827" stroke-width="5"/>
  <polygon points="1375,356 1375,394 1342,375" fill="none" stroke="#111827" stroke-width="4"/>
  <text x="1355" y="410" text-anchor="middle" class="tiny">FLYBACK DIODE</text>
  <text x="1355" y="432" text-anchor="middle" class="tiny">STRIPE / CATHODE TO RED (+)</text>

  <!-- Safety box -->
  <rect x="995" y="740" width="540" height="126" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="1265" y="774" text-anchor="middle" class="warn">NEVER CONNECT 12 V TO ESP32, VCC, IN1, OR GND</text>
  <text x="1265" y="808" text-anchor="middle" class="body">The relay contact circuit is separate from 5 V logic.</text>
  <text x="1265" y="838" text-anchor="middle" class="body">D2 protects the relay coil only; the lock needs the external diode.</text>

  <!-- Bottom steps -->
  <rect x="45" y="905" width="1510" height="105" rx="18" fill="#ffffff" stroke="#1d4f91" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#123f78">
    <circle cx="90" cy="958" r="24" fill="#1d4f91"/><text x="90" y="965" text-anchor="middle" fill="white">1</text><text x="125" y="965">POWER OFF</text>
    <circle cx="300" cy="958" r="24" fill="#1d4f91"/><text x="300" y="965" text-anchor="middle" fill="white">2</text><text x="335" y="965">WIRE 5 V LOGIC</text>
    <circle cx="555" cy="958" r="24" fill="#1d4f91"/><text x="555" y="965" text-anchor="middle" fill="white">3</text><text x="590" y="953">TEST IN1</text><text x="590" y="976">AT 3.3 V</text>
    <circle cx="770" cy="958" r="24" fill="#1d4f91"/><text x="770" y="965" text-anchor="middle" fill="white">4</text><text x="805" y="953">IDENTIFY</text><text x="805" y="976">COM + NO</text>
    <circle cx="990" cy="958" r="24" fill="#1d4f91"/><text x="990" y="965" text-anchor="middle" fill="white">5</text><text x="1025" y="953">CONNECT FUSED</text><text x="1025" y="976">12 V LOCK</text>
    <circle cx="1285" cy="958" r="24" fill="#1d4f91"/><text x="1285" y="965" text-anchor="middle" fill="white">6</text><text x="1320" y="953">TEST WITH</text><text x="1320" y="976">DOOR OPEN</text>
  </g>
</svg>

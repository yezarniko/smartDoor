<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SmartDoor ESP32 30-pin connection map</title>
  <desc id="desc">Pin locations and SmartDoor connections for the pictured 30-pin USB-C ESP32 DevKit V1-compatible board.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 20px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 22px Arial, sans-serif; fill: #111827; }
      .pin { font: 700 15px Arial, sans-serif; fill: #e5e7eb; dominant-baseline: middle; }
      .pin-used { font: 700 16px Arial, sans-serif; fill: white; dominant-baseline: middle; }
      .body { font: 18px Arial, sans-serif; fill: #1f2937; dominant-baseline: middle; }
      .small { font: 16px Arial, sans-serif; fill: #475569; }
      .warning { font: 700 18px Arial, sans-serif; fill: #991b1b; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">SMARTDOOR — YOUR ESP32 PIN LOCATIONS</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">30-pin ESP32 DevKit V1-compatible board • USB-C at the bottom</text>

  <!-- Board -->
  <g filter="url(#shadow)">
    <rect x="90" y="120" width="440" height="680" rx="28" fill="#111827" stroke="#0f172a" stroke-width="5"/>
    <rect x="185" y="145" width="250" height="105" rx="5" fill="#0b172a" stroke="#64748b" stroke-width="3"/>
    <path d="M205 180h45v-18h45v18h45v-18h45v18h30" fill="none" stroke="#334155" stroke-width="5"/>
    <rect x="175" y="270" width="270" height="225" rx="8" fill="#b8a46f" stroke="#e5d8aa" stroke-width="3"/>
    <text x="310" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">ESP-32</text>
    <text x="310" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f8fafc">Wi-Fi • Bluetooth</text>
    <rect x="250" y="750" width="120" height="64" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="270" y="760" width="80" height="28" rx="7" fill="#475569"/>
    <text x="310" y="842" text-anchor="middle" class="heading">USB-C</text>
  </g>

  <!-- Left pins: top to bottom -->
  <g>
    <circle cx="112" cy="155" r="10" fill="#334155"/><text x="137" y="155" class="pin">EN</text>
    <circle cx="112" cy="194" r="10" fill="#334155"/><text x="137" y="194" class="pin">VP</text>
    <circle cx="112" cy="233" r="10" fill="#334155"/><text x="137" y="233" class="pin">VN</text>
    <circle cx="112" cy="272" r="10" fill="#334155"/><text x="137" y="272" class="pin">D34</text>
    <circle cx="112" cy="311" r="10" fill="#334155"/><text x="137" y="311" class="pin">D35</text>
    <circle cx="112" cy="350" r="10" fill="#334155"/><text x="137" y="350" class="pin">D32</text>
    <circle cx="112" cy="389" r="10" fill="#334155"/><text x="137" y="389" class="pin">D33</text>
    <circle cx="112" cy="428" r="10" fill="#334155"/><text x="137" y="428" class="pin">D25</text>
    <circle cx="112" cy="467" r="10" fill="#334155"/><text x="137" y="467" class="pin">D26</text>
    <circle cx="112" cy="506" r="10" fill="#334155"/><text x="137" y="506" class="pin">D27</text>
    <circle cx="112" cy="545" r="10" fill="#334155"/><text x="137" y="545" class="pin">D14</text>
    <circle cx="112" cy="584" r="10" fill="#334155"/><text x="137" y="584" class="pin">D12</text>
    <circle cx="112" cy="623" r="10" fill="#334155"/><text x="137" y="623" class="pin">D13</text>
    <circle cx="112" cy="662" r="13" fill="#111111" stroke="#ffffff" stroke-width="3"/><text x="137" y="662" class="pin-used">GND</text>
    <circle cx="112" cy="701" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="3"/><text x="137" y="701" class="pin-used">VIN</text>
  </g>

  <!-- Right pins: top to bottom -->
  <g>
    <circle cx="508" cy="155" r="10" fill="#334155"/><text x="483" y="155" text-anchor="end" class="pin">D23</text>
    <circle cx="508" cy="194" r="10" fill="#334155"/><text x="483" y="194" text-anchor="end" class="pin">D22</text>
    <circle cx="508" cy="233" r="10" fill="#334155"/><text x="483" y="233" text-anchor="end" class="pin">TX0</text>
    <circle cx="508" cy="272" r="10" fill="#334155"/><text x="483" y="272" text-anchor="end" class="pin">RX0</text>
    <circle cx="508" cy="311" r="13" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text x="483" y="311" text-anchor="end" class="pin-used">D21</text>
    <circle cx="508" cy="350" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text x="483" y="350" text-anchor="end" class="pin-used">D19</text>
    <circle cx="508" cy="389" r="13" fill="#f97316" stroke="#ffffff" stroke-width="3"/><text x="483" y="389" text-anchor="end" class="pin-used">D18</text>
    <circle cx="508" cy="428" r="13" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text x="483" y="428" text-anchor="end" class="pin-used">D5</text>
    <circle cx="508" cy="467" r="10" fill="#334155"/><text x="483" y="467" text-anchor="end" class="pin">TX2</text>
    <circle cx="508" cy="506" r="10" fill="#334155"/><text x="483" y="506" text-anchor="end" class="pin">RX2</text>
    <circle cx="508" cy="545" r="10" fill="#334155"/><text x="483" y="545" text-anchor="end" class="pin">D4</text>
    <circle cx="508" cy="584" r="10" fill="#334155"/><text x="483" y="584" text-anchor="end" class="pin">D2</text>
    <circle cx="508" cy="623" r="10" fill="#334155"/><text x="483" y="623" text-anchor="end" class="pin">D15</text>
    <circle cx="508" cy="662" r="10" fill="#334155"/><text x="483" y="662" text-anchor="end" class="pin">GND</text>
    <circle cx="508" cy="701" r="10" fill="#334155"/><text x="483" y="701" text-anchor="end" class="pin">3V3</text>
  </g>

  <!-- Connections panel -->
  <rect x="585" y="125" width="565" height="610" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="620" y="175" class="heading">CONNECT THESE SIX PINS</text>

  <line x1="620" y1="220" x2="680" y2="220" class="line" stroke="#dc2626"/>
  <text x="705" y="210" class="body"><tspan font-weight="700">VIN</tspan><tspan> → relay VCC</tspan></text>
  <text x="705" y="234" class="small">5 V logic power</text>

  <line x1="620" y1="280" x2="680" y2="280" class="line" stroke="#111111"/>
  <text x="705" y="270" class="body"><tspan font-weight="700">GND</tspan><tspan> → relay GND</tspan></text>
  <text x="705" y="294" class="small">Also connect the LED and piezo ground rail</text>

  <line x1="620" y1="340" x2="680" y2="340" class="line" stroke="#f97316"/>
  <text x="705" y="330" class="body"><tspan font-weight="700">D18</tspan><tspan> → relay IN1</tspan></text>
  <text x="705" y="354" class="small">HIGH = unlock</text>

  <line x1="620" y1="400" x2="680" y2="400" class="line" stroke="#2563eb"/>
  <text x="705" y="390" class="body"><tspan font-weight="700">D19</tspan><tspan> → 220–330 Ω resistor</tspan></text>
  <text x="705" y="414" class="small">Then connect the red LOCKED LED</text>

  <line x1="620" y1="460" x2="680" y2="460" class="line" stroke="#16a34a"/>
  <text x="705" y="450" class="body"><tspan font-weight="700">D21</tspan><tspan> → 220–330 Ω resistor</tspan></text>
  <text x="705" y="474" class="small">Then connect the green UNLOCKED LED</text>

  <line x1="620" y1="520" x2="680" y2="520" class="line" stroke="#7c3aed"/>
  <text x="705" y="520" class="body"><tspan font-weight="700">D5</tspan><tspan> → passive piezo positive (+)</tspan></text>

  <rect x="620" y="570" width="490" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="645" y="610" class="warning">IMPORTANT</text>
  <text x="645" y="642" class="small">The pictured board has bare side holes.</text>
  <text x="645" y="670" class="small">Solder two 1×15 headers before using jumpers.</text>

  <rect x="75" y="852" width="1075" height="32" rx="16" fill="#fee2e2"/>
  <text x="612" y="875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Use the printed labels on the physical board as the final check before applying power.</text>
</svg>
